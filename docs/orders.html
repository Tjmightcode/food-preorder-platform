<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .orders-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    .orders-table th,
    .orders-table td {
      border: 1px solid #d8e2ec;
      padding: 0.85rem;
      text-align: left;
      vertical-align: top;
    }
    .orders-table th {
      background: #f8fafc;
    }
    .order-stats {
      display: grid;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .order-status-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .top-links {
      margin-top: 1rem;
    }
    .admin-login {
      max-width: 400px;
      margin: 2rem auto;
      padding: 2rem;
      border: 1px solid #d8e2ec;
      border-radius: 16px;
      text-align: center;
    }
    .admin-login input {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0 1rem;
      border: 1px solid #d8e2ec;
      border-radius: 8px;
    }
    .admin-login button {
      width: 100%;
      padding: 0.75rem;
      background: #1f4f8b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

      apiKey: "AIzaSyC5QkK4zDlXfE38Ie3N-NlfmdVCamuVeaQ",

      projectId: "food-preorder-system",
      storageBucket: "food-preorder-system.firebasestorage.app",

      appId: "1:844152935022:web:403dfae7516d0579758c7f",

    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-copy">
      <h1>Order Dashboard</h1>
      <p>See total placed orders, and mark pickup/delivery complete.</p>
    </div>
  </header>

  <main class="page-shell">
    <section class="menu-section">
      <div id="admin-gate"></div>
      <div id="dashboard" style="display: none;">
        <div class="top-links">
          <a href="index.html">Back to preorder</a>
        </div>

        <div id="order-stats" class="order-stats"></div>
        <div id="orders-container"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
